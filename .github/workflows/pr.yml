name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

env:
  MVN: mvn --batch-mode --no-transfer-progress

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - run: $MVN checkstyle:check

  spotbugs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - run: $MVN spotbugs:check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - run: $MVN clean package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/*.jar
          retention-days: 1

  changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            bookings:
              - 'src/main/java/booking/bookings/**'
              - 'src/main/java/booking/common/**'
            rooms:
              - 'src/main/java/booking/rooms/**'
              - 'src/main/java/booking/common/**'
            notifications:
              - 'src/main/java/booking/notifications/**'
              - 'src/main/java/booking/common/**'
            auth:
              - 'src/main/java/booking/auth/**'
              - 'src/main/java/booking/common/**'

  unit:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - run: $MVN test -Dgroups=unit -Dsurefire.shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-reports-${{ matrix.shard }}
          path: target/surefire-reports/

  integration:
    needs: [build, changes]
    if: needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - run: $MVN verify -Dgroups=integration -Dmodule=${{ matrix.module }} -Dsurefire.shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-reports-${{ matrix.module }}-${{ matrix.shard }}
          path: target/failsafe-reports/

  dependency-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - run: $MVN dependency-check:check -DfailBuildOnCVSS=7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: target/
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: booking-service:${{ github.sha }}
          outputs: type=docker,dest=/tmp/image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: /tmp/image.tar
          retention-days: 1

  api-smoke:
    needs: docker
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: /tmp
      - run: |
          docker load --input /tmp/image.tar
          docker run -d --network host booking-service:${{ github.sha }}
          ./wait-healthy.sh http://localhost:8080
      - run: $MVN verify -Dgroups=api -Dtags=smoke -Dapi.url=http://localhost:8080
