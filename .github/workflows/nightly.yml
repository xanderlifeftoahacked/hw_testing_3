name: nightly

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 3 * * 1'
  workflow_dispatch:

env:
  MVN: mvn --batch-mode --no-transfer-progress
  TEST_URL: https://booking-test.internal

jobs:
  integration-pg-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['14', '16']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - run: $MVN verify -Dgroups=integration -Dtestcontainers.postgres.version=${{ matrix.postgres }}

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - run: $MVN dependency-check:check -DfailBuildOnCVSS=7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

  e2e-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: test-stand
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - run: $MVN verify -Dgroups=e2e -Dapi.url=$TEST_URL
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs
          path: target/e2e-logs/

  load:
    if: github.event.schedule == '0 3 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: test-stand
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - run: k6 run --out json=load-summary.json load/booking.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-summary
          path: load-summary.json
